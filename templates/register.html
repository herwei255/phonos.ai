<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Phonos.ai — Create Account</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cg stroke='%23ffffff' stroke-width='2' stroke-linecap='round'%3E%3Cline x1='6' y1='16' x2='6' y2='16'/%3E%3Cline x1='10' y1='12' x2='10' y2='20'/%3E%3Cline x1='14' y1='8' x2='14' y2='24'/%3E%3Cline x1='18' y1='11' x2='18' y2='21'/%3E%3Cline x1='22' y1='13' x2='22' y2='19'/%3E%3Cline x1='26' y1='16' x2='26' y2='16'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f4f5; color: #18181b;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #fff; border: 1px solid #e4e4e7; border-radius: 16px;
      padding: 40px 36px; width: 100%; max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
      text-align: center;
    }
    .brand-icon {
      width: 48px; height: 48px; margin: 0 auto 14px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(99,102,241,.35);
    }
    h1 { font-size: 1.5rem; font-weight: 800; color: #18181b; margin-bottom: 4px; letter-spacing: -0.5px; }
    h1 span { color: #6366f1; }
    .sub { font-size: 0.85rem; color: #71717a; margin-bottom: 28px; }
    .form-wrap { text-align: left; }
    label { display: block; font-size: 0.78rem; font-weight: 600; color: #3f3f46; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 14px; border: 1px solid #e4e4e7; border-radius: 8px;
      font-size: 0.9rem; color: #18181b; background: #fafafa;
      transition: border-color .15s, background .15s; margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: #6366f1; background: #fff; }
    button[type="submit"] {
      width: 100%; padding: 11px; border-radius: 8px; border: none;
      background: #6366f1; color: #fff; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    button[type="submit"]:hover { background: #4f46e5; }
    .error {
      padding: 10px 14px; background: #fff1f2; border: 1px solid #fecdd3;
      border-radius: 8px; color: #be123c; font-size: 0.82rem; margin-bottom: 16px;
      text-align: left;
    }
    .login-link {
      margin-top: 20px; font-size: 0.82rem; color: #71717a;
    }
    .login-link a { color: #6366f1; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-icon">
      <svg width="28" height="28" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1"  y="8"  width="2" height="4" rx="1" fill="white" opacity="0.6"/>
        <rect x="4"  y="5"  width="2" height="10" rx="1" fill="white" opacity="0.8"/>
        <rect x="7"  y="3"  width="2" height="14" rx="1" fill="white"/>
        <rect x="10" y="5"  width="2" height="10" rx="1" fill="white" opacity="0.8"/>
        <rect x="13" y="7"  width="2" height="6"  rx="1" fill="white" opacity="0.7"/>
        <rect x="16" y="9"  width="2" height="2"  rx="1" fill="white" opacity="0.5"/>
      </svg>
    </div>
    <h1>Phonos<span>.ai</span></h1>
    <div class="sub">Create your account</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <div class="form-wrap">
      <form method="POST" action="/register">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               placeholder="Choose a username…" autofocus required />
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Choose a password…" required />
        <button type="submit">Create Account →</button>
      </form>
    </div>

    <div class="login-link">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>
</body>
</html>
