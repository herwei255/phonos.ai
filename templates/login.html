<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Phonos.ai — Sign In</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cg stroke='%23ffffff' stroke-width='2' stroke-linecap='round'%3E%3Cline x1='6' y1='16' x2='6' y2='16'/%3E%3Cline x1='10' y1='12' x2='10' y2='20'/%3E%3Cline x1='14' y1='8' x2='14' y2='24'/%3E%3Cline x1='18' y1='11' x2='18' y2='21'/%3E%3Cline x1='22' y1='13' x2='22' y2='19'/%3E%3Cline x1='26' y1='16' x2='26' y2='16'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f4f5; color: #18181b;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #fff; border: 1px solid #e4e4e7; border-radius: 16px;
      padding: 40px 36px; width: 100%; max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
      text-align: center;
    }
    .brand-icon {
      width: 48px; height: 48px; margin: 0 auto 14px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(99,102,241,.35);
    }
    .brand-icon svg { display: block; }
    h1 { font-size: 1.5rem; font-weight: 800; color: #18181b; margin-bottom: 4px; letter-spacing: -0.5px; }
    h1 span { color: #6366f1; }
    .sub { font-size: 0.85rem; color: #71717a; margin-bottom: 28px; }

    /* ── Google button ── */
    .google-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 11px 16px; border-radius: 8px;
      border: 1px solid #e4e4e7; background: #fff;
      font-size: 0.9rem; font-weight: 500; color: #18181b;
      text-decoration: none; cursor: pointer;
      transition: background .15s, border-color .15s, box-shadow .15s;
    }
    .google-btn:hover {
      background: #f9f9fb; border-color: #d4d4d8;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }
    .google-btn svg { flex-shrink: 0; }

    /* ── Password form ── */
    .form-wrap { text-align: left; }
    label { display: block; font-size: 0.78rem; font-weight: 600; color: #3f3f46; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%; padding: 10px 14px; border: 1px solid #e4e4e7; border-radius: 8px;
      font-size: 0.9rem; color: #18181b; background: #fafafa;
      transition: border-color .15s, background .15s; margin-bottom: 16px;
    }
    input[type="password"]:focus { outline: none; border-color: #6366f1; background: #fff; }
    button[type="submit"] {
      width: 100%; padding: 11px; border-radius: 8px; border: none;
      background: #6366f1; color: #fff; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    button[type="submit"]:hover { background: #4f46e5; }
    .error {
      padding: 10px 14px; background: #fff1f2; border: 1px solid #fecdd3;
      border-radius: 8px; color: #be123c; font-size: 0.82rem; margin-bottom: 16px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-icon">
      <svg width="28" height="28" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1"  y="8"  width="2" height="4" rx="1" fill="white" opacity="0.6"/>
        <rect x="4"  y="5"  width="2" height="10" rx="1" fill="white" opacity="0.8"/>
        <rect x="7"  y="3"  width="2" height="14" rx="1" fill="white"/>
        <rect x="10" y="5"  width="2" height="10" rx="1" fill="white" opacity="0.8"/>
        <rect x="13" y="7"  width="2" height="6"  rx="1" fill="white" opacity="0.7"/>
        <rect x="16" y="9"  width="2" height="2"  rx="1" fill="white" opacity="0.5"/>
      </svg>
    </div>
    <h1>Phonos<span>.ai</span></h1>

    {% if use_google %}
      <div class="sub">Sign in to access your voice memos</div>
      <a href="/auth/google" class="google-btn">
        <!-- Google "G" logo -->
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </a>
    {% else %}
      <div class="sub">Enter your password to continue</div>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <div class="form-wrap">
        <form method="POST" action="/login">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 placeholder="Enter password…" autofocus required />
          <button type="submit">Sign In →</button>
        </form>
      </div>
    {% endif %}
  </div>
</body>
</html>
