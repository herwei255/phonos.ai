<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meeting Notes Tool — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f4f5; color: #18181b;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #fff; border: 1px solid #e4e4e7; border-radius: 16px;
      padding: 40px 36px; width: 100%; max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
    }
    .icon { font-size: 2.4rem; margin-bottom: 12px; }
    h1 { font-size: 1.25rem; font-weight: 700; color: #18181b; margin-bottom: 4px; }
    .sub { font-size: 0.85rem; color: #71717a; margin-bottom: 28px; }
    label {
      display: block; font-size: 0.78rem; font-weight: 600; color: #3f3f46; margin-bottom: 6px;
    }
    input[type="password"] {
      width: 100%; padding: 10px 14px; border: 1px solid #e4e4e7; border-radius: 8px;
      font-size: 0.9rem; color: #18181b; background: #fafafa;
      transition: border-color .15s, background .15s; margin-bottom: 16px;
    }
    input[type="password"]:focus { outline: none; border-color: #6366f1; background: #fff; }
    button {
      width: 100%; padding: 11px; border-radius: 8px; border: none;
      background: #6366f1; color: #fff; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    button:hover { background: #4f46e5; }
    .error {
      padding: 10px 14px; background: #fff1f2; border: 1px solid #fecdd3;
      border-radius: 8px; color: #be123c; font-size: 0.82rem; margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎙️</div>
    <h1>Meeting Notes Tool</h1>
    <div class="sub">Enter your password to continue</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             placeholder="Enter password…" autofocus required />
      <button type="submit">Sign In →</button>
    </form>
  </div>
</body>
</html>
